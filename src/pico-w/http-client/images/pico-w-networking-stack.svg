<svg width="340" height="444" viewBox="0 0 340 444" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pico W networking stack layers</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a86" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="340" height="444" fill="#181818"/>

<!-- Application -->
<rect x="20" y="20" width="300" height="44" rx="8" fill="#494947" stroke="#6b6b68" stroke-width="0.5"/>
<text x="170" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#eceae4" font-family="sans-serif">Application</text>
<line x1="170" y1="64" x2="170" y2="80" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- reqwless -->
<rect x="20" y="80" width="300" height="56" rx="8" fill="#0d3049" stroke="#458588" stroke-width="0.5"/>
<text x="170" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#cfe8ee" font-family="sans-serif">reqwless</text>
<text x="170" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#7fb8c4" font-family="sans-serif">HTTP client, request/response</text>
<line x1="170" y1="136" x2="170" y2="152" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- embassy-net -->
<rect x="20" y="152" width="300" height="56" rx="8" fill="#0a3b2e" stroke="#2e8a6a" stroke-width="0.5"/>
<text x="170" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#c9ecdd" font-family="sans-serif">embassy-net</text>
<text x="170" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6fc4a0" font-family="sans-serif">IP, TCP, UDP, DHCP, DNS</text>
<line x1="170" y1="208" x2="170" y2="224" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CYW43 driver -->
<rect x="20" y="224" width="300" height="56" rx="8" fill="#0a3b2e" stroke="#2e8a6a" stroke-width="0.5"/>
<text x="170" y="242" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#c9ecdd" font-family="sans-serif">CYW43 driver</text>
<text x="170" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#6fc4a0" font-family="sans-serif">Wi-Fi control, data frames</text>
<line x1="170" y1="280" x2="170" y2="296" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- PIO-based SPI -->
<rect x="20" y="296" width="300" height="56" rx="8" fill="#5c2415" stroke="#b5502b" stroke-width="0.5"/>
<text x="170" y="314" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#f2d9c9" font-family="sans-serif">PIO-based SPI</text>
<text x="170" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#e0925f" font-family="sans-serif">Driver interface</text>
<line x1="170" y1="352" x2="170" y2="368" stroke="#8a8a86" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CYW43439 -->
<rect x="20" y="368" width="300" height="56" rx="8" fill="#5c2415" stroke="#b5502b" stroke-width="0.5"/>
<text x="170" y="386" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#f2d9c9" font-family="sans-serif">CYW43439</text>
<text x="170" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#e0925f" font-family="sans-serif">Wireless chip</text>
</svg>
